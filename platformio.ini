;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned to the set that built the Oct 22 2026 binary (IDF v4.4.7, Arduino
; core 2.0.17). Upgrade deliberately, one change at a time.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_filters = colorize


board_build.partitions = default.csv

lib_deps =
  ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
  Adafruit NeoPixel@1.12.3
  ESP32 Digital RGB LED Drivers@1.5.4
  fastled/FastLED@3.10.3

  pvizeli/CmdParser@0.0.0-alpha+sha.dcaa7eada9
  https://github.com/me-no-dev/ESPAsyncWebServer.git#7f3753454b1f176c4b6d6bcd1587a135d95ca63c
  me-no-dev/AsyncTCP@1.1.1
	bblanchon/ArduinoJson@6.21.5
  knolleary/PubSubClient@2.8.0

[env:native]
platform = native

# toggle from above to this while modifying esp32-common library
#lib_extra_dirs = /home/brian/esp32-common
build_flags = -D MQTT_MAX_PACKET_SIZE=1000